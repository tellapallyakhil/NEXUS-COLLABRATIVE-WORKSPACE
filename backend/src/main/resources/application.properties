# Core Spring Config
spring.application.name=talent-grid
server.port=8085

# Database Configuration (Supabase Cloud PostgreSQL)
spring.datasource.url=jdbc:postgresql://db.yggylxxdnuuesdfrndtj.supabase.co:5432/postgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=YOUR_SUPABASE_DB_PASSWORD
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging (Log4j2 style via SLF4J)
logging.level.com.talentgrid=DEBUG
logging.level.org.springframework.web=INFO
